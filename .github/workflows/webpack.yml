name: NodeJS with Webpack
on:
  push:
    branches: [ "Development" ]
  pull_request:
    branches: [ "Development" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 14
      uses: actions/setup-node@v4
      with:
        node-version: '14'
    - name: Build
      run: |
        npm install
        npm run build
